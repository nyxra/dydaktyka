<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <title>Zadanie 13 - Ułamek egipski</title>
</head>
<body>
    <div style="font-size:35px;">
        <script language="JavaScript">
            var m_avk = parseFloat(prompt("Podaj m=", ""));
            var m1 = m_avk + 1;
            var m2 = m_avk * (m_avk + 1);
            document.write("1/" + m_avk + " = 1/" + m1 + " + 1/" + m2 + "<br>");
        </script>
    </div>
</body>
</html>
