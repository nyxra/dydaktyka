<!doctype html><html lang="pl-PL"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KOD zadania 24 - Avksentieva</title><style>body{font:16px Arial,sans-serif;margin:24px;color:#172b3a}h1{color:#155e75}label{display:inline-block;margin:6px}input{padding:7px;width:105px}button{padding:9px 13px;margin:5px;border:0;border-radius:5px;background:#087e8b;color:white;cursor:pointer}#wynik{margin-top:14px;line-height:1.7}textarea{font:13px Consolas,monospace;max-width:100%}</style></head><body><h1>KOD - zadanie 24</h1><p>Veronika Avksentieva 3F gr. 1</p><textarea cols="110" rows="36" readonly>&lt;!doctype html&gt;
&lt;html lang=&quot;pl-PL&quot;&gt;&lt;head&gt;&lt;meta charset=&quot;utf-8&quot;&gt;&lt;meta name=&quot;viewport&quot; content=&quot;width=device-width,initial-scale=1&quot;&gt;
&lt;title&gt;Zadanie 24 - Avksentieva 3F&lt;/title&gt;&lt;style&gt;body{font:16px Arial,sans-serif;margin:24px;color:#172b3a}h1{color:#155e75}label{display:inline-block;margin:6px}input{padding:7px;width:105px}button{padding:9px 13px;margin:5px;border:0;border-radius:5px;background:#087e8b;color:white;cursor:pointer}#wynik{margin-top:14px;line-height:1.7}&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;h1&gt;Zadanie 24: Obliczenia z użyciem Math&lt;/h1&gt;&lt;p&gt;Veronika Avksentieva 3F gr. 1&lt;/p&gt;
&lt;p&gt;x1 podaj w stopniach. Imię Veronika ma 8 liter, stąd wykładnik 8/(8+2).&lt;/p&gt;&lt;button onclick=&quot;oblicz()&quot;&gt;Wczytaj dane i oblicz&lt;/button&gt;&lt;div id=&quot;wynik&quot;&gt;&lt;/div&gt;&lt;script&gt;// Veronika Avksentieva - Zadanie 24
function oblicz(){var s1=prompt(&quot;Podaj x1 w stopniach&quot;, &quot;30&quot;);if(s1===null)return;var s2=prompt(&quot;Podaj x2&quot;, &quot;2&quot;);if(s2===null)return;var x1=parseFloat(s1),x2=parseFloat(s2);if(!Number.isFinite(x1)||!Number.isFinite(x2)){document.getElementById(&#x27;wynik&#x27;).textContent=&#x27;Wprowadź dwie poprawne liczby.&#x27;;return;}var rad=x1*Math.PI/180;var y1=3*Math.pow(x1,8/(8+2));var y2=2*Math.cos(rad)+3*Math.sin(rad);var y3=Math.pow(Math.pow(x1,5)+2*Math.pow(x2,4)*Math.abs(x1-x2),1/3);document.getElementById(&#x27;wynik&#x27;).innerHTML=&#x27;Wczytane liczby: x1=&#x27;+x1+&#x27;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;x2=&#x27;+x2+&#x27;&lt;br&gt;x1 w stopniach=&#x27;+x1+&#x27;°; x1 w radianach=&#x27;+rad.toFixed(2)+&#x27;&lt;br&gt;y1 = 3 · x1^(8/10) = &#x27;+y1.toFixed(2)+&#x27;&lt;br&gt;y2 = 2 cos(x1) + 3 sin(x1) = &#x27;+y2.toFixed(2)+&#x27;&lt;br&gt;y3 = ∛(x1^5 + 2 x2^4 |x1−x2|) = &#x27;+y3.toFixed(2);}&lt;/script&gt;
&lt;p&gt;&lt;button type=&quot;button&quot; onclick=&quot;window.close()&quot;&gt;Zamknij okno&lt;/button&gt;&lt;/p&gt;
