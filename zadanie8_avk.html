<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <title>Zadanie 8 - Confirm Box</title>
    <script type="text/javascript">
        function show_confirm() {
            var r = confirm("Naciśnij klawisz");
            if (r == true) {
                document.write("Nacisnąłeś OK!");
            } else {
                document.write("Nacisnąłeś Cancel!");
            }
        }
    </script>
</head>
<body>
    <b>Zastosowanie:</b><br>
    Jest używany, jeśli chcemy zapytać użytkownika o weryfikację lub akceptację jakichś danych. Użytkownik musi nacisnąć „OK.” w celu akceptacji bądź „Cancel” w celu odrzucenia. Jeżeli zostanie wybrane „OK.” metoda zwraca true, w przeciwnym wypadku false.<br><br>
    <input type="button" onclick="show_confirm()" value="Pokaż confirm box" />
</body>
</html>
