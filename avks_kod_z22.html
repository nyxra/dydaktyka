<p>Avksentieva - CSS to język służący do opisywania wyglądu stron internetowych.
Dzięki CSS możemy kontrolować kolory, czcionki i układy elementów na stronie.
Arkusze stylów są kluczowym narzędziem każdego webdevelopera.
Stosowanie CSS znacznie ułatwia zarządzanie wyglądem całego serwisu.</p>

<p id="gruby_avksentieva">Avksentieva - Identyfikatory w CSS pozwalają nadać unikalne formatowanie
konkretnemu elementowi na stronie. Używamy znaku # przed nazwą ID.
Element z ID może wystąpić tylko raz w całym dokumencie.
Dzięki temu możemy precyzyjnie sterować wyglądem wybranych elementów.</p>

<h1 id="dlawszystkich_avksentieva">Avksentieva - Nagłówek z ID uniwersalnym.
Selektor uniwersalny z ID stosuje żółty kolor i czcionkę Arial.
Może być użyty dla różnych znaczników HTML.
To bardzo przydatna technika w CSS.</h1>

<div id="dlawszystkich_avksentieva">Avksentieva - DIV z ID uniwersalnym.
Ten blok używa tego samego identyfikatora co nagłówek powyżej.
Formatowanie jest identyczne - żółty kolor, Arial, 10pt.
Tak działa identyfikator uniwersalny w CSS.</div>
