<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <title>Zadanie 15 - Dwa takie same ułamki</title>
</head>
<body>
    <div style="font-size:35px;">
        <script language="JavaScript">
            var m_avk = parseFloat(prompt("Podaj m=", ""));
            var m2 = 2 * m_avk;
            document.write("1/" + m_avk + " = 1/" + m2 + " + 1/" + m2 + "<br>");
        </script>
    </div>
</body>
</html>
