<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <title>Zadanie 9 - Prompt Box</title>
    <script type="text/javascript">
        function show_prompt() {
            var name = prompt("Napisz imię", "Imię Nazwisko");
            if (name != null && name != "") {
                document.write("Witaj " + name + "! jak się masz?");
            }
        }
    </script>
</head>
<body>
    <b>Zastosowanie:</b><br>
    Jest używany, kiedy użytkownik ma wpisać coś np. zanim wejdzie w dany moduł strony (np. hasło). Użytkownik po wpisaniu wartości może nacisnąć „OK.” albo „Cancel”. Jeżeli użytkownik kliknie „OK.” metoda zwraca wpisaną wartość, a w przeciwnym wypadku zwraca null.<br><br>
    <input type="button" onclick="show_prompt()" value="Pokaż prompt box" />
</body>
</html>
