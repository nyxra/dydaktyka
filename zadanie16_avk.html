<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <title>Zadanie 16 - Sterowanie wydrukami</title>
</head>
<body>
    <div style="color:navy; font-size:30px;">
        <script language="JavaScript">
            var A = parseFloat(prompt("Podaj pierwszą liczbę A=", ""));
            var B = parseFloat(prompt("Podaj drugą liczbę B=", ""));
            var w1 = Math.pow(A, 3);
            var w2 = 3 * Math.pow(A, 2) * B;
            var w3 = 3 * A * Math.pow(B, 2);
            var w4 = Math.pow(B, 3);
            var suma = w1 + w2 + w3 + w4;
            document.write("wczytane liczby: A=" + A + " B=" + B + "<br>");
            document.write("(" + A + " + " + B + ")^3 = " + A + "^3 + 3*((" + A + ")^2)*(" + B + ") + 3*(" + A + ")*((" + B + ")^2) + " + B + "^3 = " + w1 + " + " + w2 + " + " + w3 + " + " + w4 + " = " + suma);
        </script>
    </div>
</body>
</html>
