<!doctype html><html lang="pl-PL"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KOD zadania 21 - Avksentieva</title><style>body{font:16px Arial,sans-serif;margin:24px;color:#172b3a}h1{color:#155e75}label{display:inline-block;margin:6px}input{padding:7px;width:105px}button{padding:9px 13px;margin:5px;border:0;border-radius:5px;background:#087e8b;color:white;cursor:pointer}#wynik{margin-top:14px;line-height:1.7}textarea{font:13px Consolas,monospace;max-width:100%}</style></head><body><h1>KOD - zadanie 21</h1><p>Veronika Avksentieva 3F gr. 1</p><textarea cols="110" rows="36" readonly>&lt;!doctype html&gt;
&lt;html lang=&quot;pl-PL&quot;&gt;&lt;head&gt;&lt;meta charset=&quot;utf-8&quot;&gt;&lt;meta name=&quot;viewport&quot; content=&quot;width=device-width,initial-scale=1&quot;&gt;
&lt;title&gt;Zadanie 21 - Avksentieva 3F&lt;/title&gt;&lt;style&gt;body{font:16px Arial,sans-serif;margin:24px;color:#172b3a}h1{color:#155e75}label{display:inline-block;margin:6px}input{padding:7px;width:105px}button{padding:9px 13px;margin:5px;border:0;border-radius:5px;background:#087e8b;color:white;cursor:pointer}#wynik{margin-top:14px;line-height:1.7}&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;h1&gt;Zadanie 21: Walec: objętość i pole całkowite&lt;/h1&gt;&lt;p&gt;Veronika Avksentieva 3F gr. 1&lt;/p&gt;
&lt;form id=&quot;formularz&quot;&gt;&lt;label&gt;Promień r [cm] &lt;input id=&quot;r&quot; type=&quot;number&quot; step=&quot;any&quot; value=&quot;2&quot;&gt;&lt;/label&gt;&lt;label&gt;Wysokość h [cm] &lt;input id=&quot;h&quot; type=&quot;number&quot; step=&quot;any&quot; value=&quot;5&quot;&gt;&lt;/label&gt;&lt;button&gt;Oblicz V i Pc&lt;/button&gt;&lt;/form&gt;&lt;div id=&quot;wynik&quot;&gt;&lt;/div&gt;&lt;script&gt;// Veronika Avksentieva - Zadanie 21
function V(r,h){return Math.PI*r*r*h;}
function Pc(r,h){return 2*Math.PI*r*r+2*Math.PI*r*h;}
document.getElementById(&#x27;formularz&#x27;).addEventListener(&#x27;submit&#x27;,function(e){e.preventDefault();var r=Number(document.getElementById(&#x27;r&#x27;).value),h=Number(document.getElementById(&#x27;h&#x27;).value);document.getElementById(&#x27;wynik&#x27;).innerHTML=&#x27;V = &#x27;+V(r,h).toFixed(2)+&#x27; cm³&lt;br&gt;Pc = &#x27;+Pc(r,h).toFixed(2)+&#x27; cm²&#x27;;});&lt;/script&gt;
&lt;p&gt;&lt;button type=&quot;button&quot; onclick=&quot;window.close()&quot;&gt;Zamknij okno&lt;/button&gt;&lt;/p&gt;
&lt;/body&gt;&lt;/html&gt;</textarea><p><button onclick="window.close()">Zamknij okno</button></p></body></html>
