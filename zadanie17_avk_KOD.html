&lt;h1&gt;Zadanie 17: Teoria: funkcje i DOM&lt;/h1&gt;&lt;p&gt;Veronika Avksentieva 3F gr. 1&lt;/p&gt;
&lt;article&gt;&lt;b&gt;1. Wymień cztery sposoby wyprowadzania danych.&lt;/b&gt;&lt;p&gt;document.write(), alert(), pola formularza (.value), elementy strony, np. tabela lub element z innerHTML.&lt;/p&gt;&lt;/article&gt;&lt;article&gt;&lt;b&gt;2. Czym jest funkcja w JS?&lt;/b&gt;&lt;p&gt;To nazwany zbiór instrukcji; po wywołaniu wykonuje swój kod; może przyjmować argumenty; może zwrócić wynik przez return.&lt;/p&gt;&lt;/article&gt;&lt;article&gt;&lt;b&gt;3. Metody document.&lt;/b&gt;&lt;p&gt;getElementsByName(name) pobiera elementy z daną nazwą; getElementById(id) wyszukuje element o danym id; getElementsByTagName(tag) pobiera elementy danego typu znacznika.&lt;/p&gt;&lt;/article&gt;&lt;article&gt;&lt;b&gt;4. Właściwości elementu.&lt;/b&gt;&lt;p&gt;innerHTML odczytuje lub ustawia zawartość HTML; innerText odczytuje lub ustawia tekst; className odczytuje lub zmienia klasę CSS.&lt;/p&gt;&lt;/article&gt;
&lt;p&gt;&lt;button type=&quot;button&quot; onclick=&quot;window.close()&quot;&gt;Zamknij okno&lt;/button&gt;&lt;/p&gt;
&lt;/body&gt;&lt;/html&gt;</textarea><p><button onclick="window.close()">Zamknij okno</button></p></body></html>
