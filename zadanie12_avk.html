<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <title>Zadanie 12 - Avksentieva</title>
</head>
<body>
    <div style="color:green; font-size:45px;">
        <script language="JavaScript">
            var D1_avk = parseFloat(prompt("D1=", ""));
            var G1_avk = parseFloat(prompt("G1=", ""));
            var D2_avk = parseFloat(prompt("D2=", ""));
            var G2_avk = parseFloat(prompt("G2=", ""));
            var sekund = ((D1_avk - D2_avk) * 24 + (G1_avk - G2_avk)) * 3600;
            document.write("Ilość sekund = " + sekund + " sekund<br>");
            function okno_zamknij_avksentieva() {
                window.close();
            }
        </script>
    </div>
    <input type="button" value="zamknij okno" onclick="okno_zamknij_avksentieva()"/>
</body>
</html>
