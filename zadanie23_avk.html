<!doctype html>
<html lang="pl-PL"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zadanie 23 - Avksentieva 3F</title><style>body{font:16px Arial,sans-serif;margin:24px;color:#172b3a}h1{color:#155e75}label{display:inline-block;margin:6px}input{padding:7px;width:105px}button{padding:9px 13px;margin:5px;border:0;border-radius:5px;background:#087e8b;color:white;cursor:pointer}#wynik{margin-top:14px;line-height:1.7}</style></head><body>
<h1>Zadanie 23: Drabina oparta o mur</h1><p>Veronika Avksentieva 3F gr. 1</p>
<p>Podaj wysokość oparcia D i odległość podstawy od muru X.</p><label>D [m] <input id="d" type="number" step="any" value="3"></label><label>X [m] <input id="x" type="number" step="any" value="4"></label><button onclick="oblicz()">Oblicz</button><a href="zadanie23_avk_KOD.html">KOD</a><div id="wynik"></div><script>// Veronika Avksentieva - Zadanie 23
function drabina(d,x){return Math.hypot(d,x);}
function kat(d,x){return Math.atan2(d,x)*180/Math.PI;}
function oblicz(){var d=Number(document.getElementById('d').value),x=Number(document.getElementById('x').value);if(d<0||x<=0){document.getElementById('wynik').textContent='Podaj D ≥ 0 i X > 0.';return;}document.getElementById('wynik').innerHTML='Długość drabiny = '+drabina(d,x).toFixed(2)+' m<br>Kąt nachylenia = '+kat(d,x).toFixed(2)+'°';}</script>
<p><button type="button" onclick="window.close()">Zamknij okno</button></p>
</body></html>
