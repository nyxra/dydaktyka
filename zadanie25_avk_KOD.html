<!doctype html><html lang="pl-PL"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KOD zadania 25 - Avksentieva</title><style>body{font:16px Arial,sans-serif;margin:24px;color:#172b3a}h1{color:#155e75}label{display:inline-block;margin:6px}input{padding:7px;width:105px}button{padding:9px 13px;margin:5px;border:0;border-radius:5px;background:#087e8b;color:white;cursor:pointer}#wynik{margin-top:14px;line-height:1.7}textarea{font:13px Consolas,monospace;max-width:100%}</style></head><body><h1>KOD - zadanie 25</h1><p>Veronika Avksentieva 3F gr. 1</p><textarea cols="110" rows="36" readonly>&lt;!doctype html&gt;
&lt;html lang=&quot;pl-PL&quot;&gt;&lt;head&gt;&lt;meta charset=&quot;utf-8&quot;&gt;&lt;meta name=&quot;viewport&quot; content=&quot;width=device-width,initial-scale=1&quot;&gt;
&lt;title&gt;Zadanie 25 - Avksentieva 3F&lt;/title&gt;&lt;style&gt;body{font:16px Arial,sans-serif;margin:24px;color:#172b3a}h1{color:#155e75}label{display:inline-block;margin:6px}input{padding:7px;width:105px}button{padding:9px 13px;margin:5px;border:0;border-radius:5px;background:#087e8b;color:white;cursor:pointer}#wynik{margin-top:14px;line-height:1.7}&lt;/style&gt;&lt;/head&gt;&lt;body&gt;
&lt;h1&gt;Zadanie 25: Rozpad promieniotwórczy&lt;/h1&gt;&lt;p&gt;Veronika Avksentieva 3F gr. 1&lt;/p&gt;
&lt;p&gt;Wzory: λ = ln(2)/T½, N = N₀·e^(−λt). Węgiel-14: T½=5700 lat; rad-226: T½=1600 lat (&lt;a href=&quot;https://www.nrc.gov/sites/default/files/documents/radium_faq102008.pdf&quot;&gt;U.S. Nuclear Regulatory Commission&lt;/a&gt;).&lt;/p&gt;&lt;button onclick=&quot;oblicz()&quot;&gt;Wczytaj dane i oblicz&lt;/button&gt;&lt;div id=&quot;wynik&quot;&gt;&lt;/div&gt;&lt;script&gt;// Veronika Avksentieva - Zadanie 25
function oblicz(){var a=prompt(&#x27;Podaj ilość początkową N0&#x27;,&#x27;1000&#x27;);if(a===null)return;var b=prompt(&#x27;Podaj czas t w latach&#x27;,&#x27;5700&#x27;);if(b===null)return;var c=prompt(&#x27;Podaj czas połowicznego rozpadu T1/2 w latach (C-14=5700, Ra-226=1600)&#x27;,&#x27;5700&#x27;);if(c===null)return;var n0=parseFloat(a),t=parseFloat(b),half=parseFloat(c);if(!Number.isFinite(n0)||!Number.isFinite(t)||!Number.isFinite(half)||half&lt;=0){document.getElementById(&#x27;wynik&#x27;).textContent=&#x27;Wpisz poprawne liczby; T1/2 musi być dodatni.&#x27;;return;}var lambda=Math.LN2/half,N=n0*Math.pow(Math.E,-lambda*t);document.getElementById(&#x27;wynik&#x27;).innerHTML=&#x27;λ = &#x27;+lambda.toFixed(7)+&#x27; 1/rok&lt;br&gt;N = &#x27;+N.toFixed(2)+&#x27; atomów&#x27;;}&lt;/script&gt;
&lt;p&gt;&lt;button type=&quot;button&quot; onclick=&quot;window.close()&quot;&gt;Zamknij okno&lt;/button&gt;&lt;/p&gt;
&lt;/body&gt;&lt;/html&gt;</textarea><p><button onclick="window.close()">Zamknij okno</button></p></body></html>
