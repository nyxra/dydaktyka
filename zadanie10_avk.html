<!DOCTYPE html>
<html lang="pl-PL">

     <title>proste obliczenia - Avksentieva 3f</title>

<body>
       <div style="color:red;font-size:50px;">
        <script language="JavaScript">
// Veronika Avksentieva 3f gr.1
// Zadanie 10
               var liczba1=prompt("liczba1=","");
               var liczba2=prompt("liczba2=","");
               var suma;
                var a=parseFloat(liczba1);
                var b=parseFloat(liczba2);
                 suma=a+b;
                 document.write("suma="+a+" + "+b+" = "+suma+"<br>");
               function okno_zamknij_avksentieva()
                {
                  window.close()
                }
         </script>
       </div>
       <input type="button" value="zamknij okno" onclick="okno_zamknij_avksentieva()"/>
</body>
