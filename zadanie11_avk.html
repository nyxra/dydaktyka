<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <title>Zadanie 11 - Avksentieva</title>
</head>
<body>
    <div style="color:green; font-size:45px;">
        <script language="JavaScript">
            var D1_avk = prompt("Data1=", "");
            var D2_avk = prompt("Data2=", "");
            var a = parseFloat(D1_avk);
            var b = parseFloat(D2_avk);
            var sekund = (a - b) * 24 * 60 * 60;
            document.write("Ilość sekund między dniami " + a + " i " + b + " = " + sekund + "<br>");
            function okno_zamknij_avksentieva() {
                window.close();
            }
        </script>
    </div>
    <input type="button" value="zamknij okno" onclick="okno_zamknij_avksentieva()"/>
</body>
</html>
