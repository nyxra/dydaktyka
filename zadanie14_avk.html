<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <title>Zadanie 14 - Ułamek egipski na 3</title>
</head>
<body>
    <div style="font-size:35px;">
        <script language="JavaScript">
            var m_avk = parseFloat(prompt("Podaj m=", ""));
            var m1 = m_avk + 1;
            var m2 = m1 + 1;
            var m3 = m1 * (m1 + 1);
            var m4 = m_avk * (m_avk + 1);
            document.write("1/" + m_avk + " = 1/" + m2 + " + 1/" + m3 + " + 1/" + m4 + "<br>");
        </script>
    </div>
</body>
</html>
